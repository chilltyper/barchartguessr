        <h6>Welcome to Bar Chart Guessr!</h6>
        <br>
        <br>
        <br>
        <p><strong>Bar Chart Guessr</strong> is a fun game where you guess the month + year only off of a screenshot of one point in a bar chart race.</p>
        <br>
        <br>
        <h5>Examples of bar chart races (from actual gameplay)👇</h5>
        <br>
        <br>
        <br>
        <div class="hpcharts" style="display: flex; gap: 50px; justify-content: center; padding: 20px;">
            <figure style="margin: 0; width: 35%; box-shadow: 0 4px 8px rgba(0, 146, 171, 0.2); border-radius: 10px; border: 10px solid rgba(1, 90, 125, 0.8);">
                <img src="images/memes/meme1125.png" alt="Meme Bar Chart Race" style="width: 100%; display: block;">
                <figcaption style="text-align: center; font-size: 14px; padding: 5px; color: white;">Most Popular Memes Bar Chart Race</figcaption>
            </figure>
            <figure style="margin: 0; width: 35%; box-shadow: 0 4px 8px rgba(0, 146, 171, 0.2); border-radius: 10px; border: 10px solid rgba(1, 90, 125, 0.8);">
                <img src="images/videogames/vg0616.png" alt="Video Game Bar Chart Race" style="width: 100%; display: block;">
                <figcaption style="text-align: center; font-size: 14px; padding: 5px; color: white;">Most Popular Video Games Bar Chart Race</figcaption>
            </figure>
        </div>
